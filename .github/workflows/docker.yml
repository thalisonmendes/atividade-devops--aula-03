name: Construir, testar e publicar imagem Docker

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t meu-primeiro-docker .

      - name: Rodar container
        run: docker run -d -p 8080:80 --name meu-container meu-primeiro-docker

      - name: Aguardar container
        run: sleep 5

      - name: Testar container
        run: curl -f http://localhost:8080

      - name: Fazer login no Docker Hub
  uses: docker/login-action@v3
  with:
    username: thalisonmendes
    password: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker tag meu-primeiro-docker thalisonmendes/meu-primeiro-docker:latest
          docker push thalisonmendes/meu-primeiro-docker:latest
